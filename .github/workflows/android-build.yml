name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip3 install buildozer cython requests
        # إضافة مسار bin إلى الـ PATH لضمان عمل buildozer
        echo "$HOME/.local/bin" >> ~/.bashrc

    - name: Accept Android SDK Licenses
      run: |
        # هذه الخطوة هي الحل لمشكلة الـ aidl والرخص
        yes | sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        # بناء التطبيق بصيغة debug
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: APK-File
        path: bin/*.apk
